    <script>
      async function loadLatestPost() {
        const container = document.getElementById('latest-post-content');

        try {
          // Use WordPress's JSON API instead of the RSS feed. The RSS endpoint
          // does not currently allow cross-origin browser requests.
          const endpoint = 'https://arash.au/wp-json/wp/v2/posts?per_page=1&_fields=link,title,date,excerpt';
          const response = await fetch(endpoint);
          if (!response.ok) throw new Error('Posts API request failed');

          const posts = await response.json();
          if (!Array.isArray(posts) || !posts.length) throw new Error('No posts found');

          const post = posts[0];
          const link = new URL(post.link || 'https://arash.au');
          if (link.protocol !== 'https:') throw new Error('Unexpected post URL');

          const title = post.title?.rendered || 'Latest post';
          const excerpt = (post.excerpt?.rendered || '')
            .replace(/<[^>]*>/g, '')
            .replace(/&amp;/g, '&')
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&#8217;/g, '’')
            .replace(/&#8220;|&#8221;/g, '“')
            .replace(/\s+/g, ' ')
            .trim();

          container.replaceChildren();

          const titleLink = document.createElement('a');
          titleLink.className = 'post-title';
          titleLink.href = link.href;
          titleLink.target = '_blank';
          titleLink.rel = 'noopener noreferrer';
          titleLink.textContent = title;
          container.appendChild(titleLink);

          if (post.date) {
            const date = document.createElement('div');
            date.className = 'post-meta';
            date.textContent = new Date(post.date).toLocaleDateString();
            container.appendChild(date);
          }

          const summary = document.createElement('p');
          summary.className = 'post-excerpt';
          summary.textContent = excerpt
            ? (excerpt.length > 180 ? excerpt.substring(0, 180).trim() + '…' : excerpt)
            : 'Read the latest post on Arash.au.';
          container.appendChild(summary);
        } catch (error) {
          container.innerHTML = '<p class="post-excerpt">Unable to load the latest post right now. <a href="https://arash.au" target="_blank" rel="noopener noreferrer">Visit the blog</a>.</p>';
        }
      }

      loadLatestPost();
    </script>
